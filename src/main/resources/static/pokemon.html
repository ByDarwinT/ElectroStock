<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>ElectroStock | Pokémon Catalog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<main class="container py-4 py-md-5">
<header class="text-center mb-4">
<h1 class="fw-bold">Pokémon Catalog</h1>
<p class="text-secondary mb-0">Explore Pokémon with PokéAPI</p>
</header>
<nav aria-label="Catalog navigation" class="nav nav-pills justify-content-center gap-2 mb-4"><a class="nav-link" href="/">Products</a><a aria-current="page" class="nav-link active" href="/pokemon.html">Pokémon</a></nav>


<section aria-label="Pokémon search" class="mx-auto mb-4" style="max-width: 940px;">
<label class="form-label fw-semibold" for="pokemonSearch">Search Pokémon</label>
<div class="input-group input-group-lg">
<input aria-describedby="pokemonSearchIcon" autocomplete="off" class="form-control" id="pokemonSearch" placeholder="Search by Pokémon name or Pokédex number..." type="search"/>
<span aria-hidden="true" class="input-group-text" id="pokemonSearchIcon">🔍</span>
</div>
<p aria-live="polite" class="form-text" id="pokemonStatus" role="status">Open this tab to load Pokémon.</p>
</section>
<section aria-label="Pokémon filters" class="mx-auto mb-4" style="max-width: 940px;">
<div class="row g-3">
<div class="col-12 col-md-6"><label for="typeFilter" class="form-label fw-semibold">Filter by type</label><select id="typeFilter" class="form-select"><option value="all">All types</option></select></div>
<div class="col-12 col-md-6"><label for="generationFilter" class="form-label fw-semibold">Filter by generation</label><select id="generationFilter" class="form-select"><option value="all">All generations</option></select></div>
</div><p class="form-text">Search and filters work together. Search starts 4 seconds after typing stops.</p>
</section>
<section aria-label="Pokémon catalog">
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="pokemonGrid"></div>
<p class="text-center text-secondary py-5 d-none" id="pokemonEmpty">No matching Pokémon found.</p>
<div class="text-center my-4"><button class="btn btn-outline-primary d-none" id="pokemonMore" type="button">Load more</button></div>
</section>

</main>
<div aria-hidden="true" aria-labelledby="productModalTitle" class="modal fade" id="productModal" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content">
<div class="modal-header">
<h2 class="modal-title fs-5" id="productModalTitle">Product details</h2>
<button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
</div>
<div class="modal-body" id="productModalBody"></div>
<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script defer src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script defer src="/js/pokemon.js"></script>
</body>
</html>
