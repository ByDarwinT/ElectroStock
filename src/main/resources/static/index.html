<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>ElectroStock | Product Catalog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<main class="container py-4 py-md-5">
<header class="text-center mb-4">
<h1 class="fw-bold">ElectroStock</h1>
<p class="text-secondary mb-0">Explore our electronics and appliances</p>
</header>
<nav aria-label="Catalog navigation" class="nav nav-pills justify-content-center gap-2 mb-4"><a aria-current="page" class="nav-link active" href="/">Products</a><a class="nav-link" href="/pokemon.html">Pokémon</a></nav>

<section aria-label="Product search" class="mx-auto mb-4" style="max-width: 940px;">
<label class="form-label fw-semibold" for="searchInput">Search products</label>
<div class="input-group input-group-lg">
<input aria-describedby="searchIcon" autocomplete="off" class="form-control" id="searchInput" placeholder="Search by name, brand, or category..." type="search"/>
<span aria-hidden="true" class="input-group-text" id="searchIcon">🔍</span>
</div>
<p aria-live="polite" class="form-text" id="searchStatus" role="status">Loading products...</p>
</section>
<section aria-label="Available products">
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="productGrid"></div>
<p class="text-center text-secondary py-5 d-none" id="emptyMessage">No matching products found.</p>
</section>


</main>
<div aria-hidden="true" aria-labelledby="productModalTitle" class="modal fade" id="productModal" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content">
<div class="modal-header">
<h2 class="modal-title fs-5" id="productModalTitle">Product details</h2>
<button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
</div>
<div class="modal-body" id="productModalBody"></div>
<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script defer src="/js/catalog.js"></script>

</body>
</html>
